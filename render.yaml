services:
  - type: web
    name: marginal-paper-reader
    runtime: python
    plan: free
    buildCommand: npm ci && npm run build && pip install -r requirements.txt
    startCommand: python -m backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
